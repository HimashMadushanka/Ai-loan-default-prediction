services:
  ai-loan-default-app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: loan_default_prediction_app
    ports:
      - "8000:8000"   # FastAPI Backend & Swagger Docs
      - "8501:8501"   # Streamlit Interactive Web Dashboard
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=loan_system
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEY=loan-predict-dev-key-2026
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
